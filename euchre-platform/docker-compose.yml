services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: euchreflow
      POSTGRES_USER: euchreflow
      POSTGRES_PASSWORD: euchreflow
    ports:
      - "5432:5432"
    volumes:
      - euchreflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U euchreflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  euchreflow-data:
