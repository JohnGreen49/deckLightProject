spring:
  application:
    name: euchre-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/euchreflow}
    username: ${DB_USER:euchreflow}
    password: ${DB_PASSWORD:euchreflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
